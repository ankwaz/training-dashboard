function filterRows(){let p=state.page,list=db[p]||[];return list.filter(x=>{

 let rnd=(p==='trainers'||p==='notices')?true:(state.round==='전체'||x.round===state.round);
 let q=String(state.query||'').trim().toLowerCase();let match=!q||Object.values(x).some(v=>String(v??'').toLowerCase().includes(q));
 if(p==='notices') { yr=state.year==='전체'||x.year===state.year;grade=state.grade==='전체'||String(x.gradeRound).includes(state.grade);rnd=state.round==='전체'||String(x.gradeRound).includes(state.round);}
 if(p==='trainers'&&state.extraFilter)match=match&&x.inOut===state.extraFilter;

 });}

function refreshGrid(){if(['dashboard','settings'].includes(state.page))return;visibleCols=getCols();visibleRows=filterRows();let zone=document.getElementById('gridZone');if(!zone)return;
 let html=`<div class="table-note"><span><b>${visibleRows.length.toLocaleString()}</b>개 행 표시</span><span>전체 ${db[state.page].length.toLocaleString()}개 행</span><span class="shortcut">Tab 이동</span><span class="shortcut">Ctrl + V 범위 붙여넣기</span><span>열이 더 있으면 가로로 스크롤하세요 →</span></div>`;

 (state.page==='assignments'?`<select class="control" id="batchField"><option value="mailSent">서류 발송</option><option value="docsReceived">서류 회신</option><option value="pptReceived">교안 회신</option></select><select class="control" id="batchStatus">${opt(['O','X','요청','완료','미발송','미회신','필요X',''], '완료')}</select><button class="btn mini primary" onclick="bulkSet()">일괄 적용</button>`:'')+

 html+=`<div class="table-frame" id="tableFrame"><table class="data-table"><thead><tr><th style="width:41px;min-width:41px"><input class="check" type="checkbox" title="전체 선택" ${visibleRows.length&&visibleRows.every(r=>state.selected.has(r.id))?'checked':''} onchange="selectAll(this.checked)"></th><th style="width:41px;min-width:41px">#</th>${visibleCols.map(c=>`<th style="width:${c.w}px;min-width:${c.w}px">${esc(c.label)}</th>`).join('')}${state.page==='notices'?'<th>안내문</th>':''}</tr></thead><tbody>`;
 if(!visibleRows.length) html+=`<tr><td colspan="${visibleCols.length+3}"><div class="empty"><b>표시할 데이터가 없습니다.</b>필터를 변경하거나 새 행을 추가해 주세요.</div></td></tr>`;
 else for(let i=0;i<visibleRows.length;i++){
 const row=visibleRows[i];html+=`<tr><td style="width:41px;min-width:41px"><input class="check" type="checkbox" ${state.selected.has(row.id)?'checked':''} onchange="selectOne('${esc(row.id)}',this.checked)"></td><td class="row-no">${i+1}</td>`;
 visibleCols.forEach((col,j)=>{html+=`<td style="min-width:${col.w}px;width:${col.w}px">${renderCell(row,col,i,j)}</td>`});
 if(state.page==='notices')html+=`<td><button class="btn mini" onclick="copyNotice('${esc(row.id)}')">문자 초안 복사</button></td>`;
 html+='</tr>';
 }html+='</tbody></table></div>';
 const amount=(state.page==='spend')?visibleRows.reduce((sum,x)=>sum+n(x.total),0):null;
 html+=`<div class="summarybar"><span>원본에 있던 값은 그대로 가져왔으며, 수정한 값만 갱신됩니다.</span><span>${amount!==null?`합계 <strong>${fmt(amount)}원</strong> · `:''}현재 목록 <strong>${visibleRows.length.toLocaleString()}행</strong></span></div>`;
 const old=zone.querySelector('#tableFrame');const pos=old?{top:old.scrollTop,left:old.scrollLeft}:null;zone.innerHTML=html;const next=zone.querySelector('#tableFrame');if(pos&&next){next.scrollTop=pos.top;next.scrollLeft=pos.left;}}
function renderCell(r,c,i,j){const v=r[c.key]??'';let common=`data-row="${i}" data-col="${j}" data-id="${esc(r.id)}" data-key="${esc(c.key)}"`;
 if(c.type==='readonlyMoney')return `<span class="cell-readonly">${fmt(v)}</span>`;
 if(c.type==='status'||c.type==='inOut'||c.type==='yesno'){
  let choices=c.type==='status'?['','O','X','요청','완료','미발송','미회신','필요X','해당없음']:c.type==='inOut'?['','내부','외부']:['','O','X'];
  if(v!==''&&!choices.includes(String(v)))choices.push(String(v));
  return `<select class="cell-select" ${common} onchange="cellChange(this)" onpaste="pasteGrid(event,this)">${opt(choices,String(v))}</select>`;
 }
 let type=c.type==='date'?'date':(c.type==='number'||c.type==='money'||c.type==='score')?'number':'text';let attrs=type==='number'?'step="any"':'';
 return `<input class="cell-input ${type==='number'?'cell-number':''}" ${common} type="${type}" ${attrs} value="${esc(v)}" placeholder="${c.key==='instructor'?'강사 입력':c.key==='name'?'이름 입력':''}" ${c.key==='instructor'?'list="trainerNames"':''} onchange="cellChange(this)" onpaste="pasteGrid(event,this)" onkeydown="gridKey(event,this)" ${c.key==='instructor'?'onblur="fillTrainerInfo(this)"':''}>`;
}
function cellChange(el){const r=(db[state.page]||[]).find(x=>x.id===el.dataset.id);if(!r)return;let value=el.value;const key=el.dataset.key;if(numKeys.has(key))value=value===''?'':Number(value);r[key]=value;
 if(state.page==='spend'&&['internalFee','externalFee','safetyFee'].includes(key))r.total=n(r.internalFee)+n(r.externalFee)+n(r.safetyFee);
 save();if(state.page==='spend')refreshGrid();}
function fillTrainerInfo(el){if(!el||state.page!=='assignments')return;const row=db.assignments.find(x=>x.id===el.dataset.id);if(!row||!row.instructor)return;const hits=db.trainers.filter(x=>x.name&&x.name.trim()===String(row.instructor).trim());if(hits.length!==1)return;
 let changed=false;for(const k of ['phone','email','inOut','affiliation','position','career','level'])if(!row[k]&&hits[0][k]){row[k]=hits[0][k];changed=true;}if(changed){save();refreshGrid();toast('등록된 강사의 기본정보를 불러왔습니다.');}}
function gridKey(ev,el){if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();const next=document.querySelector(`[data-row="${Number(el.dataset.row)+1}"][data-col="${el.dataset.col}"]`);if(next)next.focus();}}
function pasteGrid(ev,el){let t=ev.clipboardData?.getData('text/plain')||'';if(!t.includes('\t')&&!t.includes('\n'))return;ev.preventDefault();const matrix=t.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(line=>line.split('\t'));
 const startR=Number(el.dataset.row),startC=Number(el.dataset.col);let count=0;
 for(let i=0;i<matrix.length;i++){
  let row=visibleRows[startR+i];if(!row){if(state.page==='assignments'&&state.grade!=='전체'&&state.round!=='전체'&&state.year!=='전체'){row=newRow('assignments');visibleRows.push(row);}else break;}
  matrix[i].forEach((value,j)=>{const col=visibleCols[startC+j];if(!col||col.type==='readonlyMoney')return;row[col.key]=numKeys.has(col.key)?(value.trim()===''?'':Number(value.replaceAll(',',''))):value;count++;});
  if(state.page==='spend')row.total=n(row.internalFee)+n(row.externalFee)+n(row.safetyFee);
 }
 save();refreshGrid();toast(`${count}개 셀을 붙여넣었습니다.`);}

  const ids=new Set(Array.from(state.selected, String));
  const trainers=db.trainers.filter(t=>ids.has(String(t.id)));
  if(!trainers.length){state.selected.clear();refreshGrid();toast('삭제할 강사를 먼저 선택해 주세요.');return;}
  const refs=db.assignments.filter(a=>ids.has(String(a.trainerId||'')));
  pendingTrainerRemoval={ids:trainers.map(t=>String(t.id)),names:trainers.map(t=>t.name||'(이름 미입력)'),referenceCount:refs.length};
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this){pendingTrainerRemoval=null;closeModal()}"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="trainerDeleteTitle"><h2 id="trainerDeleteTitle">강사 기본정보 삭제 확인</h2><p>선택한 <strong>${trainers.length}명</strong>의 강사 기본정보를 삭제합니다.</p><div class="notice ${refs.length?'warning':''}" style="margin:14px 0;line-height:1.8"><b>삭제 대상</b><br>${esc(trainers.map(t=>t.name||'(이름 미입력)').slice(0,6).join(', '))}${trainers.length>6?' 외 '+(trainers.length-6)+'명':''}<br>${refs.length?`<strong>연결된 강의 배정 ${refs.length}건</strong>이 있습니다.<br>강사 기본정보와 연결을 해제하되, 강의 일정·강사명·소속 및 계산된 강사료 금액은 기존 배정표에 보존합니다.<br>자동 산정액은 수정되지 않도록 수동 금액으로 보존됩니다.`:'연결된 강의 배정은 없습니다.'}</div><p style="font-size:12px">삭제한 강사 기본정보 자체는 JSON 백업으로만 복구할 수 있습니다. 삭제 전에 전체 데이터 백업을 권장합니다.</p><div class="modal-actions"><button type="button" class="btn" onclick="pendingTrainerRemoval=null;closeModal()">취소</button><button type="button" class="btn danger" onclick="commitTrainerDeletion()">강사 ${trainers.length}명 삭제 실행</button></div></div></div>`;
};
function commitTrainerDeletion(){
  const job=pendingTrainerRemoval;if(!job){closeModal();return;}
  const ids=new Set(job.ids);
  const chosen=db.trainers.filter(t=>ids.has(String(t.id)));
  const byId=new Map(chosen.map(t=>[String(t.id),t]));
  // Before unlinking, snapshot all calculated fees (including grouped lectures).
  const linked=db.assignments.filter(a=>byId.has(String(a.trainerId||'')));
  const fees=new Map(linked.map(a=>[a.id,a.feeMode==='manual'?null:feeAmount(a)]));
  for(const a of linked){
    const t=byId.get(String(a.trainerId));
    for(const k of ['affiliation','position','career','phone','email','inOut'])a[k]=t[k]??a[k]??'';
    a.instructor=t.name||a.instructor||'';
    a.level=t.feeLevel||t.level||a.level||'';
    a.unlinkedTrainerName=a.instructor;
    if(a.feeMode!=='manual'){
      const amount=fees.get(a.id);
      if(amount!==null&&Number.isFinite(amount)){
        a.lectureFee=amount;
        a.feeAutoSnapshot=true;
      }else{
        a.lectureFee='';
        a.feeAutoSnapshot=true;
      }
      a.feeMode='manual';
    }
    a.trainerId='';
  }
  db.trainers=db.trainers.filter(t=>!ids.has(String(t.id)));
  pendingTrainerRemoval=null;
  state.selected.clear();
  save();closeModal();render();
  toast(`${chosen.length}명 삭제 완료${linked.length?` · 연결된 강의 ${linked.length}건 보존`:''}`);
}
const v31RenderLinkedCellPrev=renderLinkedCell;
renderLinkedCell=function(row,col,i,j){
  if(col.type==='trainerSelect'&&!row.trainerId&&row.unlinkedTrainerName){
    const html=v31RenderLinkedCellPrev(row,col,i,j);
    return html.replace('<option value="">— 등록된 강사 선택 —</option>',`<option value="" selected>⚠ 기존 강사 삭제: ${esc(row.unlinkedTrainerName)}</option>`);
  }
  return v31RenderLinkedCellPrev(row,col,i,j);
};
const v31CellChangePrev=cellChange;
cellChange=function(el){
  const isReassign=state.page==='assignments'&&el.dataset.key==='trainerId'&&!!el.value;
  const row=isReassign?db.assignments.find(a=>String(a.id)===String(el.dataset.id)):null;
  v31CellChangePrev(el);
  if(isReassign&&row&&row.unlinkedTrainerName){
    if(row.feeAutoSnapshot===true){row.feeMode='auto';row.lectureFee='';}
    delete row.feeAutoSnapshot;
    delete row.unlinkedTrainerName;
    save();refreshGrid();
  }
};
const v31DataPagePrev=renderDataPage;
renderDataPage=function(){
  let html=v31DataPagePrev();
  if(state.page==='trainers')html=html.replace('<div class="card"><div class="toolbar">',`<div class="notice" style="margin:0 0 13px">강사를 삭제하려면 왼쪽 체크박스로 행을 선택한 뒤 <strong>선택 행 삭제</strong>를 누르세요. 이미 배정된 강사도 삭제할 수 있으며, 연결된 강의 기록은 보존됩니다.</div><div class="card"><div class="toolbar">`);
  return html;
};
render();
</script>
